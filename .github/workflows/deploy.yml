name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # xlsx 는 npm 레지스트리가 아니라 cdn.sheetjs.com tarball 에서 받는다.
      # (레지스트리판은 0.18.5 에서 멈춰 있고 보안 권고가 있다)
      - run: npm ci
      # 시험용 엑셀 파일을 만들어 lib/parse.js 단위 테스트를 돌린다
      - run: npm test
      - run: npm run build
      # enablement: true 를 주면 저장소 Settings > Pages 를 손으로 켜지 않아도
      # 워크플로가 Pages 를 켜고 source 를 GitHub Actions 로 맞춰 준다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
